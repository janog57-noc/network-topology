name: Deploy Physical Topology

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [netbox_update]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Go + Graphviz による既存の画像生成（従来方式）
      # ============================================================
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Build Go application
        run: go build -o network-topology ./cmd/network-topology/

      - name: Generate topology (Go + Graphviz)
        env:
          NETBOX_URL: ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
        run: ./network-topology

      # ============================================================
      # Shumoku による追加の画像生成（新方式）
      # - Graphviz不要、純JavaScript
      # - より柔軟なレイアウトとスタイリング
      # ============================================================
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate topology (Shumoku)
        env:
          NETBOX_URL: ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
        run: |
          bunx netbox-to-shumoku --output out/topology-shumoku.svg
          bunx netbox-to-shumoku --output out/topology-shumoku.yaml

      # ============================================================
      # 出力確認とデプロイ
      # ============================================================
      - name: Check output files
        run: |
          echo "=== Output files ==="
          ls -la out/
          echo ""
          echo "=== File sizes ==="
          du -h out/*

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
