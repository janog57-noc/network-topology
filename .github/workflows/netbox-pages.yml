name: Deploy Network Topology

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [netbox_update]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Fetch OCX topology
        env:
          OCX_URL: ${{ secrets.OCX_URL }}
          OCX_TOKEN: ${{ secrets.OCX_TOKEN }}
          OCX_TOKEN_ID: ${{ secrets.OCX_TOKEN_ID }}
        run: node src/ocx-integration/cli.mjs -o ocx-topology.json

      - name: Fetch NetBox topology
        env:
          NETBOX_URL: ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
        run: npx netbox-to-shumoku --format json --output netbox.json

      - name: Merge topologies
        run: node src/merge-json.js netbox.json ocx-topology.json -o merged.json

      - name: Generate HTML
        run: |
          mkdir -p out
          npx shumoku render merged.json --format html --output out/index.html

      - name: Check output files
        run: |
          echo "=== Output files ==="
          ls -la out/
          echo ""
          echo "=== File sizes ==="
          du -h out/*

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
