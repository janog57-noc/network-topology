name: Deploy Network Topology

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  repository_dispatch:
    types: [netbox_update]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate topology (Shumoku HTML)
        env:
          NETBOX_URL: ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
        run: |
          bun add @shumoku/netbox
          bunx netbox-to-shumoku --format html --output out/index --legend
          bunx netbox-to-shumoku --format yaml --output out/topology

      - name: Check output files
        run: |
          echo "=== Output files ==="
          ls -la out/
          echo ""
          echo "=== File sizes ==="
          du -h out/*

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
