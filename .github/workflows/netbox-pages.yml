name: Deploy Physical Topology

on:
  workflow_dispatch:
  repository_dispatch:
    types: [netbox_update]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # 1. Graphvizのインストール
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # 2. Goを実行して topology.dot を生成
      - name: Generate DOT file
        env:
          NETBOX_URL: ${{ secrets.NETBOX_URL }}
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }}
        run: go run main.go

      # 3. DOT を SVG に変換
      - name: Convert DOT to SVG
        run: dot -Tsvg topology.dot -o topology.svg

      # 4. GitHub Pages用にアップロード
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: . 

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
