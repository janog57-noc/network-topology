name: Update Network Topology

on:
  workflow_dispatch: # 手動実行ボタン
  repository_dispatch: # NetBoxからのWebhook受け口
    types: [netbox_update]

jobs:
  generate-diagram:
    runs-on: ubuntu-latest
    permissions:
      contents: write # リポジトリへの書き込み権限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install D2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Generate .d2 file from NetBox
        env:
          NETBOX_URL: ${{ secrets.NETBOX_URL }}     # GitHub Secretsに設定
          NETBOX_TOKEN: ${{ secrets.NETBOX_TOKEN }} # GitHub Secretsに設定
        run: go run main.go

      - name: Convert D2 to SVG
        run: d2 topology.d2 topology.svg

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update network topology from NetBox"
          file_pattern: "topology.svg topology.d2"
